[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# Program ID do deploy na Devnet. Precisa ser IDENTICO ao declare_id!() em
# programs/awakefl/src/lib.rs — `anchor keys sync` faz os dois de uma vez.
[programs.devnet]
awakefl = "GhMhTkv7jeHMejEyypQaEFPqduHgXDSzE5g7jE3rXGRA"

[programs.localnet]
awakefl = "GhMhTkv7jeHMejEyypQaEFPqduHgXDSzE5g7jE3rXGRA"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
