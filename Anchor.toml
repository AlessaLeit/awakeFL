[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# Substitua o ID abaixo pelo valor de `anchor keys list` apos o primeiro build.
# Ele precisa ser IDENTICO ao declare_id!() em programs/fl-reputation/src/lib.rs.
# `anchor keys sync` faz os dois de uma vez.
[programs.devnet]
fl_reputation = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.localnet]
fl_reputation = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
