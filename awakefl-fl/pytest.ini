[pytest]
testpaths = tests
# O anchorpy registra um plugin de pytest que importa `pytest_asyncio` no
# carregamento. Como a integracao on-chain e opcional (extra `[chain]`), esse
# plugin quebraria a suite inteira de quem instalou o anchorpy sem o
# pytest-asyncio — um efeito colateral absurdo para quem so quer rodar os
# testes de reputacao. Desligamos o plugin: nenhum teste daqui precisa dele.
addopts = -p no:anchorpy -q
