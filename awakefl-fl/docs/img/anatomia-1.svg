<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 320" role="img" aria-label="Curvas de reputação ao longo de 12 rodadas: dois participantes honestos sobem de 0,5 para cerca de 0,95, enquanto três atacantes oscilam e depois despencam abaixo do limiar de 0,4 nas rodadas 6 e 7." xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="720" height="320" rx="10" fill="#0e0e0e"/>
        <!-- grade -->
        <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
          <line x1="56" y1="20" x2="690" y2="20"/>
          <line x1="56" y1="82.5" x2="690" y2="82.5"/>
          <line x1="56" y1="145" x2="690" y2="145"/>
          <line x1="56" y1="207.5" x2="690" y2="207.5"/>
          <line x1="56" y1="270" x2="690" y2="270"/>
        </g>
        <!-- rótulos y -->
        <g fill="#7a7877" font-family="JetBrains Mono, monospace" font-size="10.5" text-anchor="end">
          <text x="44" y="24">1,0</text>
          <text x="44" y="86.5">0,8</text>
          <text x="44" y="149">0,6</text>
          <text x="44" y="211.5">0,4</text>
          <text x="44" y="274">0,2</text>
        </g>
        <!-- limiar -->
        <line x1="56" y1="170" x2="690" y2="170" stroke="#ff5449" stroke-width="1.25" stroke-dasharray="5 4" opacity="0.75"/>
        <text x="690" y="163" fill="#ff5449" font-family="JetBrains Mono, monospace" font-size="10.5" text-anchor="end">limiar de banimento · 0,4</text>

        <!-- honestos -->
        <polyline fill="none" stroke="#a8a5a4" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"
          points="56,145 108.8,85.5 161.7,52.8 214.5,40 267.3,35.8 320.2,33.3 373,32.5 425.8,49.5 478.7,44 531.5,41.5 584.3,39.5 637.2,29.8 690,43.8"/>
        <polyline fill="none" stroke="#a8a5a4" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"
          points="56,145 108.8,88 161.7,56.3 214.5,52.5 267.3,38.5 320.2,30 373,26.5 425.8,34.5 478.7,42 531.5,41.5 584.3,32.3 637.2,26.5 690,42.3"/>

        <!-- atacantes -->
        <polyline fill="none" stroke="#ff5449" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"
          points="56,145 108.8,124.3 161.7,146 214.5,88.8 267.3,107 320.2,113.5 373,167.8 425.8,261.8"/>
        <polyline fill="none" stroke="#ff5449" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" opacity="0.72"
          points="56,145 108.8,104.5 161.7,102.8 214.5,86.8 267.3,102.3 320.2,137.8 373,261.5"/>
        <polyline fill="none" stroke="#ff5449" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"
          points="56,145 108.8,128.8 161.7,145.8 214.5,105 267.3,129.3 320.2,119.8 373,260.3"/>

        <!-- marcas de banimento -->
        <circle cx="373" cy="261.5" r="3.6" fill="#ff5449"/>
        <circle cx="373" cy="260.3" r="3.6" fill="#ff5449"/>
        <circle cx="425.8" cy="261.8" r="3.6" fill="#ff5449"/>
        <text x="382" y="252" fill="#ff5449" font-family="JetBrains Mono, monospace" font-size="10.5">banidos r6</text>
        <text x="434" y="279" fill="#ff5449" font-family="JetBrains Mono, monospace" font-size="10.5">r7</text>

        <!-- ponto de partida -->
        <circle cx="56" cy="145" r="3.2" fill="#4af403"/>
        <text x="63" y="136" fill="#4af403" font-family="JetBrains Mono, monospace" font-size="10.5">R₀ = 0,5 · todos</text>

        <!-- eixo x -->
        <line x1="56" y1="290" x2="690" y2="290" stroke="rgba(255,255,255,0.1)"/>
        <g fill="#7a7877" font-family="JetBrains Mono, monospace" font-size="10.5" text-anchor="middle">
          <text x="108.8" y="306">1</text>
          <text x="214.5" y="306">3</text>
          <text x="320.2" y="306">5</text>
          <text x="425.8" y="306">7</text>
          <text x="531.5" y="306">9</text>
          <text x="637.2" y="306">11</text>
        </g>
        <text x="373" y="306" fill="#7a7877" font-family="JetBrains Mono, monospace" font-size="10.5" text-anchor="middle">6</text>
      </svg>
