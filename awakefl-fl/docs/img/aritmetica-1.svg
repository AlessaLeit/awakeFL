<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 330" role="img" aria-labelledby="tit-fig desc-fig" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="720" height="330" rx="10" fill="#0e0e0e"/>
            <title id="tit-fig">Os cinco updates da rodada, a mediana e a média</title>
            <desc id="desc-fig">Quatro setas honestas apontam para a direita e ligeiramente para cima, agrupadas. A seta do atacante aponta para a esquerda e para cima. A mediana fica no meio do grupo honesto; a média é visivelmente arrastada em direção ao atacante.</desc>

            <!-- eixos -->
            <line x1="40" y1="270" x2="690" y2="270" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
            <line x1="300" y1="30" x2="300" y2="290" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
            <text x="300" y="305" fill="#7a7877" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">origem</text>

            <!-- setas honestas -->
            <g stroke="#a8a5a4" stroke-width="2" fill="none" stroke-linecap="round">
              <line x1="300" y1="270" x2="480" y2="234"/>
              <line x1="300" y1="270" x2="462" y2="207"/>
              <line x1="300" y1="270" x2="498" y2="252"/>
            </g>
            <g fill="#a8a5a4" font-family="JetBrains Mono, monospace" font-size="11">
              <text x="490" y="242">P0</text>
              <text x="454" y="192" text-anchor="end">P1</text>
              <text x="508" y="258">P2</text>
            </g>

            <!-- mediana: por baixo, grossa -->
            <line x1="300" y1="270" x2="471" y2="216" stroke="#4af403" stroke-width="7" stroke-linecap="round" opacity="0.30"/>
            <!-- P3 coincide exatamente com a mediana -->
            <line x1="300" y1="270" x2="471" y2="216" stroke="#e5e2e1" stroke-width="2" stroke-linecap="round"/>
            <text x="479" y="208" fill="#e5e2e1" font-family="JetBrains Mono, monospace" font-size="11">P3</text>
            <text x="479" y="221" fill="#4af403" font-family="JetBrains Mono, monospace" font-size="11">= mediana</text>

            <!-- media: arrastada -->
            <line x1="300" y1="270" x2="413" y2="214" stroke="#fab219" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
            <text x="352" y="200" fill="#fab219" font-family="JetBrains Mono, monospace" font-size="11">média</text>

            <!-- atacante -->
            <line x1="300" y1="270" x2="156" y2="162" stroke="#ff5449" stroke-width="2.5" stroke-linecap="round"/>
            <text x="120" y="152" fill="#ff5449" font-family="JetBrains Mono, monospace" font-size="11">P4 atacante</text>

            <!-- arco do angulo ENTRE a referencia e o atacante: 125,6 graus -->
            <path d="M 357.2 252.0 A 60 60 0 0 0 252.0 234.0" fill="none" stroke="rgba(255,84,73,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
            <text x="312" y="196" fill="#ff5449" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">126°</text>
          </svg>
